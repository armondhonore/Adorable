application:
  name: adorable-ai
  pods:
    - name: app
      image: "registry.nexlayer.io/user_01kece1xyh817dwff7wnarhkxd/adorable:19ee2d8aac5"
      path: /
      servicePorts:
        - 3000
      vars:
        NODE_ENV: production
        PORT: "3000"
        LLM_PROVIDER: nexlayer
        NEXLAYER_MODEL: bode-flagship
      secrets:
        - name: app-secrets
          data: |
            VLLM_BASE_URL=# filled by platform agent
            NEXLAYER_ACCESS_CODE=# filled by platform agent
            FREESTYLE_API_KEY=# get from freestyle.sh dashboard
          fileName: app.env
          mountPath: /run/secrets
